<text x='454' y='747' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>重置：恢复并保持出口隔离</text>
<rect x='806' y='590' width='355' height='320' rx='10' fill='#142733' stroke='#c984f7' stroke-width='2'/>
