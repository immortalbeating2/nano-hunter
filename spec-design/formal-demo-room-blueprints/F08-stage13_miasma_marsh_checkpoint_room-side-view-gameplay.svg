<text x='86' y='724' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>节拍：全程0/5，恢复呼吸</text>
<text x='86' y='747' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>路线：恢复主路 / F10 回环落点</text>
