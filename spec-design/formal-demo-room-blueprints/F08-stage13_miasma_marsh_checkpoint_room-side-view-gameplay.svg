<text x='454' y='655' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>策略：safe_no_encounter</text>
<text x='454' y='678' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>遭遇：checkpoint 房必须全房安全。</text>
