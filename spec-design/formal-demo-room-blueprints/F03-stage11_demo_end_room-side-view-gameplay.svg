<text x='822' y='724' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>持久状态：waystation_unlocked / bounty_cycl</text>
<text x='822' y='743' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>e_completed</text>
<text x='822' y='766' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>地图：主线出口高；返回口中；可选支路中；秘密低。</text>
<rect x='1174' y='590' width='355' height='320' rx='10' fill='#142733' stroke='#e9b95d' stroke-width='2'/>
<text x='1190' y='622' fill='#e9b95d' font-family='Microsoft YaHei,Segoe UI' font-size='18' font-weight='700'>4 相机、地标与表现</text>
<text x='1190' y='655' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>地标：悬钟、赏榜与驿路界碑</text>
<text x='1190' y='678' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>正向：入口安全地面、主地标与前方第一决策同屏，保留右向 look-ahead</text>
<text x='1190' y='697' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>。</text>
<text x='1190' y='720' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>反向：反向出生点、返回地板与最近出口隔离同屏，保留左向 look-ahead</text>
<text x='1190' y='739' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>。</text>
<text x='1190' y='762' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>锁镜：no_camera_lock</text>
<text x='1190' y='785' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>遮挡：遮挡角色轮廓超过 15% 或进入 64u 安全圈时淡出</text>
