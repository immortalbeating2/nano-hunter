<text x='454' y='678' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>遭遇：F02_first_hunt</text>
<text x='454' y='701' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>危险：单敌攻击</text>
<text x='454' y='724' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>回落：主战坪和观察台</text>
