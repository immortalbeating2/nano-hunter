<text x='86' y='622' fill='#55d6e8' font-family='Microsoft YaHei,Segoe UI' font-size='18' font-weight='700'>1 空间与移动</text>
<text x='86' y='655' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>分段：3 屏 / 1920u</text>
<text x='86' y='678' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>首次：120-180s</text>
<text x='86' y='701' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>回访：20-35s</text>
<text x='86' y='724' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>节拍：1→2→0/5，观察-战斗-结算</text>
