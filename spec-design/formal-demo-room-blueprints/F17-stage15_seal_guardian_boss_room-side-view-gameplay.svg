<text x='86' y='701' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>回访：180-360s</text>
<text x='86' y='724' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>节拍：0→5/5，前室停顿后Boss峰值</text>
<text x='86' y='747' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>路线：入口至锁镜 arena / 本地失败重试</text>
