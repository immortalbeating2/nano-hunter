<text x='86' y='622' fill='#55d6e8' font-family='Microsoft YaHei,Segoe UI' font-size='18' font-weight='700'>1 空间与移动</text>
<text x='86' y='655' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>分段：3 屏 / 1920u</text>
<text x='86' y='678' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>首次：60-90s</text>
<text x='86' y='701' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>回访：35-55s</text>
<text x='86' y='724' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>节拍：0→1/5，长镜头揭示</text>
<text x='86' y='747' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>路线：首次下泽 / 返程快线</text>
<rect x='438' y='590' width='355' height='320' rx='10' fill='#142733' stroke='#ef7d7d' stroke-width='2'/>
<text x='454' y='622' fill='#ef7d7d' font-family='Microsoft YaHei,Segoe UI' font-size='18' font-weight='700'>2 遭遇与危险</text>
<text x='454' y='655' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>策略：safe_no_encounter</text>
<text x='454' y='678' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>遭遇：区域揭示房不叠加战斗，保证地标与危险预读。</text>
<text x='454' y='701' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>危险：浅瘴视觉预告</text>
<text x='454' y='724' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>回落：高岸、栈道、出口前庭</text>
<text x='454' y='747' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>重置：回到当前段上一个宽台</text>
<rect x='806' y='590' width='355' height='320' rx='10' fill='#142733' stroke='#c984f7' stroke-width='2'/>
<text x='822' y='622' fill='#c984f7' font-family='Microsoft YaHei,Segoe UI' font-size='18' font-weight='700'>3 交互、门控与状态</text>
<text x='822' y='655' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>连接：F04_to_F05 / F04_to_F03</text>
<text x='822' y='678' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>交互：</text>
<text x='822' y='701' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>奖励：none</text>
<text x='822' y='724' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>持久状态：</text>
<text x='822' y='747' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>地图：主线出口高；返回口中；可选支路中；秘密低。</text>
<rect x='1174' y='590' width='355' height='320' rx='10' fill='#142733' stroke='#e9b95d' stroke-width='2'/>
<text x='1190' y='622' fill='#e9b95d' font-family='Microsoft YaHei,Segoe UI' font-size='18' font-weight='700'>4 相机、地标与表现</text>
<text x='1190' y='655' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>地标：倒悬镇妖塔与瘴泽水线</text>
<text x='1190' y='678' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>正向：入口安全地面、主地标与前方第一决策同屏，保留右向 look-ahead</text>
<text x='1190' y='697' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>。</text>
<text x='1190' y='720' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>反向：反向出生点、返回地板与最近出口隔离同屏，保留左向 look-ahead</text>
<text x='1190' y='739' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>。</text>
<text x='1190' y='762' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>锁镜：no_camera_lock</text>
<text x='1190' y='785' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>遮挡：遮挡角色轮廓超过 15% 或进入 64u 安全圈时淡出</text>
<text x='70' y='958' fill='#87a8b8' font-family='Microsoft YaHei,Segoe UI' font-size='13'>◆ Spawn/出口 ｜ ▲ 遭遇/危险 ｜ ■ 交互/门控 ｜ 粗灰线=可踩结构 ｜ 彩线=玩家路线 ｜ 四层合同均来自同一 JSON</text>
