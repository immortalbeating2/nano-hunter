<text x='86' y='655' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>分段：3 屏 / 1920u</text>
<text x='86' y='678' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>首次：90-150s</text>
<text x='86' y='701' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>回访：35-60s</text>
<text x='86' y='724' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>节拍：0→1→1/5，观察-选择-离场</text>
<text x='86' y='747' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>路线：中层主路至 F12 / 下层低风险至 F10 / 上层高风险至 F11</text>
<text x='86' y='766' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'> / Air Dash 上层高速线</text>
<rect x='438' y='590' width='355' height='320' rx='10' fill='#142733' stroke='#ef7d7d' stroke-width='2'/>
<text x='454' y='622' fill='#ef7d7d' font-family='Microsoft YaHei,Segoe UI' font-size='18' font-weight='700'>2 遭遇与危险</text>
<text x='454' y='655' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>策略：safe_no_encounter</text>
<text x='454' y='678' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>遭遇：选择区保持安全，让三高度四路线可读。</text>
<text x='454' y='701' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>危险：下穿单向承诺 / 上层跨距</text>
<text x='454' y='724' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>回落：中层判读台与各出口前庭</text>
<text x='454' y='747' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>重置：回到当前路线入口，不调用全局跌落</text>
<rect x='806' y='590' width='355' height='320' rx='10' fill='#142733' stroke='#c984f7' stroke-width='2'/>
<text x='822' y='622' fill='#c984f7' font-family='Microsoft YaHei,Segoe UI' font-size='18' font-weight='700'>3 交互、门控与状态</text>
<text x='822' y='655' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>连接：F09_to_F12 / F09_to_F08 / F09_to_F1</text>
<text x='822' y='674' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>0 / F09_to_F11 / F09_fast_to_F12</text>
<text x='822' y='697' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>交互：Air Dash 上层入口 / 接 F12 快线</text>
<text x='822' y='720' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>奖励：f09_air_dash_route_completed</text>
<text x='822' y='743' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>持久状态：f09_air_dash_route_completed</text>
<text x='822' y='766' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>地图：主线出口高；返回口中；可选支路中；秘密低。</text>
<rect x='1174' y='590' width='355' height='320' rx='10' fill='#142733' stroke='#e9b95d' stroke-width='2'/>
<text x='1190' y='622' fill='#e9b95d' font-family='Microsoft YaHei,Segoe UI' font-size='18' font-weight='700'>4 相机、地标与表现</text>
<text x='1190' y='655' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>地标：三面镇妖幡与枯树桥</text>
<text x='1190' y='678' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>正向：入口安全地面、主地标与前方第一决策同屏，保留右向 look-ahead</text>
<text x='1190' y='697' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>。</text>
<text x='1190' y='720' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>反向：反向出生点、返回地板与最近出口隔离同屏，保留左向 look-ahead</text>
<text x='1190' y='739' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>。</text>
<text x='1190' y='762' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>锁镜：no_camera_lock</text>
<text x='1190' y='785' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>遮挡：遮挡角色轮廓超过 15% 或进入 64u 安全圈时淡出</text>
