<text x='1190' y='655' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>地标：断瘴风印龛</text>
<text x='1190' y='678' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>正向：入口安全地面、主地标与前方第一决策同屏，保留右向 look-ahead</text>
