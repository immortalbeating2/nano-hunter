<rect x='70' y='590' width='355' height='320' rx='10' fill='#142733' stroke='#55d6e8' stroke-width='2'/>
<text x='86' y='622' fill='#55d6e8' font-family='Microsoft YaHei,Segoe UI' font-size='18' font-weight='700'>1 空间与移动</text>
<text x='86' y='655' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>分段：4 屏 / 2560u</text>
<text x='86' y='678' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>首次：240-360s</text>
<text x='86' y='701' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>回访：120-200s</text>
<text x='86' y='724' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>节拍：2→3→4→1/5，四段递进</text>
<text x='86' y='747' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>路线：综合战斗主线 / Dash/Air Dash 战斗重写线</text>
<rect x='438' y='590' width='355' height='320' rx='10' fill='#142733' stroke='#ef7d7d' stroke-width='2'/>
<text x='454' y='622' fill='#ef7d7d' font-family='Microsoft YaHei,Segoe UI' font-size='18' font-weight='700'>2 遭遇与危险</text>
<text x='454' y='655' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>策略：authored_combat_encounters</text>
<text x='454' y='678' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>遭遇：F16_ground_opening / F16_dash_corri</text>
<text x='454' y='697' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>dor / F16_air_layer</text>
<text x='454' y='720' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>危险：三段敌人组合 / 上层跌落</text>
<text x='454' y='743' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>回落：段间缓冲与脱战凹槽</text>
<text x='454' y='766' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>重置：仅重置当前战段，保留已清前段</text>
<rect x='806' y='590' width='355' height='320' rx='10' fill='#142733' stroke='#c984f7' stroke-width='2'/>
<text x='822' y='622' fill='#c984f7' font-family='Microsoft YaHei,Segoe UI' font-size='18' font-weight='700'>3 交互、门控与状态</text>
<text x='822' y='655' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>连接：F16_to_F17 / F16_to_F15</text>
<text x='822' y='678' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>交互：清场妖气结界</text>
<text x='822' y='701' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>奖励：mixed_gauntlet_completed</text>
<text x='822' y='724' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>持久状态：forward_room_completed</text>
<text x='822' y='747' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>地图：主线出口高；返回口中；可选支路中；秘密低。</text>
<rect x='1174' y='590' width='355' height='320' rx='10' fill='#142733' stroke='#e9b95d' stroke-width='2'/>
<text x='1190' y='622' fill='#e9b95d' font-family='Microsoft YaHei,Segoe UI' font-size='18' font-weight='700'>4 相机、地标与表现</text>
<text x='1190' y='655' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>地标：四象缚妖阵</text>
<text x='1190' y='678' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>正向：入口安全地面、主地标与前方第一决策同屏，保留右向 look-ahead</text>
<text x='1190' y='697' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>。</text>
<text x='1190' y='720' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>反向：反向出生点、返回地板与最近出口隔离同屏，保留左向 look-ahead</text>
<text x='1190' y='739' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>。</text>
<text x='1190' y='762' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>锁镜：只在遭遇触发后锁当前战段；清场或允许退场时解除。</text>
<text x='1190' y='785' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>遮挡：遮挡角色轮廓超过 15% 或进入 64u 安全圈时淡出</text>
<text x='70' y='958' fill='#87a8b8' font-family='Microsoft YaHei,Segoe UI' font-size='13'>◆ Spawn/出口 ｜ ▲ 遭遇/危险 ｜ ■ 交互/门控 ｜ 粗灰线=可踩结构 ｜ 彩线=玩家路线 ｜ 四层合同均来自同一 JSON</text>
