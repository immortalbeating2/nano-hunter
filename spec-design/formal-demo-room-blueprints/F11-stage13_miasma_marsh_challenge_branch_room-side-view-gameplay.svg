<text x='454' y='701' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>危险：双层敌人压力</text>
<text x='454' y='724' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>回落：前坪与两条脱离线</text>
<text x='454' y='747' fill='#c8d7dd' font-family='Microsoft YaHei,Segoe UI' font-size='12'>重置：重置遭遇、结界与未领取奖励</text>
<rect x='806' y='590' width='355' height='320' rx='10' fill='#142733' stroke='#c984f7' stroke-width='2'/>
<text x='822' y='622' fill='#c984f7' font-family='Microsoft YaHei,Segoe UI' font-size='18' font-weight='700'>3 交互、门控与状态</text>
